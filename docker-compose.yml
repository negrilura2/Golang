services:
  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: mall-nginx
    restart: unless-stopped
    ports:
      - "8080:80" #宿主 8080 - nginx 80, 唯一入口
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro #配置只读写入
    depends_on:
      - edu-mall-app
    networks:
      - mall-net
  edu-mall-app:
      build: . #用根目录 Dockerfile 现编
      image: edu-mall:local
      container_name: edu-mall-app
      restart: unless-stopped
      environment:
        - TZ=Asia/Shanghai
        - MALL_SERVER_HTTP_PORT=8089
        - MALL_SERVER_ENV=dev
        - MALL_SERVER_LOG_LEVEL=debug
        - MALL_MYSQL_HOST=my-mysql
        - MALL_MYSQL_PORT=3306
        - MALL_MYSQL_USER=root
        - MALL_MYSQL_DATABASE=edu.mall
        - MALL_MYSQL_SHOW_SQL=true
        - MALL_REDIS_ADDR=redis-dev:6379
        - MALL_REDIS_DB_INDEX=0
        - MALL_KAFKA_BROKERS=kafka:29092
        - MALL_SERVER_ENABLE_PPROF=true
      env_file:
        - .env.docker #密钥单独放，不入git
      networks:
        - mall-net
networks:
  mall-net:
    external: true #复用建好的 已连上infra的那个
