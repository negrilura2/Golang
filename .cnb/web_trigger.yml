# .cnb/web_trigger.yml
branch:
  # 匹配dev分支
  - reg: "^dev"
    buttons:
      - name: DEV部署
        # 如存在，则将作为流水线 title，否则流水线使用默认 title
        description: 开发环境部署
        event: web_trigger_dev # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - developer

        # 可输入环境变量，可覆盖上述 env 的变量配置
        inputs:
          # 目前支持以下三种格式：输入框（input）、多行文本输入框（textarea）、下拉选择框（select 支持单选和多选），switch 开关
          # 其中 key 值（var1、var2、var3、var4、var5）为环境变量名
          tag_name:
            # 输入框
            name: tag名称
            description: 请输入release.sh push提交的tag名称。示例：dev-1.2.1-b816255f
            required: true # 是否必填
            type: input

  # 匹配dev分支
  - reg: "^master"
    buttons:
      - name: 生产部署
        # 如存在，则将作为流水线 title，否则流水线使用默认 title
        description: 生产环境部署
        event: web_trigger_prod # 触发的 CI 事件名
        permissions:
          roles:
            - owner

        # 可输入环境变量，可覆盖上述 env 的变量配置
        inputs:
          # 目前支持以下三种格式：输入框（input）、多行文本输入框（textarea）、下拉选择框（select 支持单选和多选），switch 开关
          # 其中 key 值（var1、var2、var3、var4、var5）为环境变量名
          tag_name:
            # 输入框
            name: tag名称
            description: 请输入release.sh push提交的tag名称，示例：prod-1.2.1-b816255f
            required: true # 是否必填
            type: input
