name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }} #当前分支名字 用ci-前缀分组。
  cancel-in-progress: true #同组新run一来，旧的直接掐掉。
jobs:
  quality:
    name: Go质量检查
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 格式检查
        run: | #表示后面这些行都是一整段shell命令（叫做块标量）
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: 静态检查
        run: go vet ./...
      - name: 跑单测
        run: go test ./...
      - name: 编译
        run: go build ./...
  build-push:
    name: 构建并推送镜像
    runs-on: ubuntu-22.04
    needs: quality #质量门全绿，才进发布流程
    if: github.event_name != 'pull_request' #PR不推镜像，只有push/手动派发推
    permissions:
      contents: read
      packages: write # 本次run的最小权限， 可写ghcr包
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #系统自动给的token，零密钥
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/negrilura2/golang:sha-${{ github.sha }}
            ghcr.io/negrilura2/golang:latest